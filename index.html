<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Моя Кухня">
    <meta name="theme-color" content="#C4773B">
    <meta name="description" content="Рецепты, теория и планировщик с поддержкой заморозки">
    <link rel="manifest" href="manifest.json">
    <title>Моя Кухня - Рецепты и планировщик</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1C1208;--cream:#FAF6EF;--warm:#F0E8D8;--border:#E8DDD0;
  --brown:#8B6347;--accent:#C4773B;--green:#3D6B47;--muted:#9A8878;
  --white:#fff;--r:14px;--rs:8px;--gap:16px;--pad:24px;--sidebar:240px;
}
body{background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--ink);color:var(--cream);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:100}
.main{margin-left:var(--sidebar);flex:1}
.logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo h1{font-family:'Playfair Display',serif;font-size:20px;line-height:1.2;color:var(--cream)}
.logo h1 span{color:var(--accent);font-style:italic}
.logo p{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1.5px;text-transform:uppercase}
.sec-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:14px 20px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.65);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--cream)}
.nav-item.active{background:rgba(196,119,59,.15);color:var(--accent);border-left-color:var(--accent)}
.nav-item .ni{font-size:15px;width:18px}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.header-left h2{font-family:'Playfair Display',serif;font-size:22px}
.header-left p{font-size:12px;color:var(--muted);margin-top:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--warm);border-radius:30px;padding:7px 14px;min-width:180px}
.search input{border:none;background:transparent;outline:none;font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);width:100%}
.content{padding:24px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--gap)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--gap)}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(28,18,8,.1)}
.card-hero{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.card-body{padding:13px}
.card-body h3{font-family:'Playfair Display',serif;font-size:14px;margin-bottom:4px;line-height:1.3}
.card-body p{font-size:11px;color:var(--muted);line-height:1.5}
.tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.t-time{background:#FFF3E0;color:#E65100}.t-port{background:#E8F5E9;color:#2E7D32}.t-freeze{background:#E3F2FD;color:#1565C0}
.fav-btn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:18px;transition:color .15s}
.back:hover{color:var(--accent)}
.detail-hero{background:var(--ink);color:var(--cream);border-radius:var(--r);padding:24px;margin-bottom:18px;display:flex;gap:18px;align-items:flex-start}
.detail-hero .emoji{font-size:52px;flex-shrink:0}
.detail-hero h1{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:5px}
.detail-hero p{font-size:12px;opacity:.6;line-height:1.6}
.meta-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.meta-chip{background:rgba(255,255,255,.1);padding:4px 11px;border-radius:20px;font-size:10px}
.recipe-photo-wrap{margin-bottom:18px;border-radius:var(--r);overflow:hidden;max-height:420px}
.recipe-photo{width:100%;height:100%;object-fit:cover;display:block;max-height:420px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--white);border-radius:var(--r);padding:var(--pad);border:1px solid var(--border)}
.box.full{grid-column:1/-1}
.box h4{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid var(--warm)}
.ing-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--warm);font-size:13px}
.ing-row:last-child{border:none}
.ing-row .amt{color:var(--muted)}
.step{display:flex;gap:11px;margin-bottom:11px}
.step-n{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.step p{font-size:13px;line-height:1.7}
.freeze-box{background:#E3F2FD;border-radius:var(--rs);padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:10px}
.tip-box{background:#FFF8F0;border-left:4px solid var(--accent);padding:9px 13px;border-radius:0 var(--rs) var(--rs) 0;font-size:12px;line-height:1.6;margin:8px 0}
.grocery-panel{background:var(--green);color:#fff;border-radius:var(--r);padding:var(--pad);margin-top:14px}
.grocery-panel h4{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:10px}
.g-row{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:13px}
.g-row:last-child{border:none}
.g-check{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.g-check.on{background:#fff;border-color:#fff}
.g-check.on::after{content:'✓';color:var(--green);font-size:10px;font-weight:700}
.theory-card{background:var(--white);border-radius:var(--r);padding:var(--pad);border:1px solid var(--border);cursor:pointer;transition:transform .2s}
.theory-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(28,18,8,.08)}
.theory-card .ti{font-size:30px;margin-bottom:8px}
.theory-card h3{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:4px}
.theory-card p{font-size:12px;color:var(--muted)}
.t-section{background:var(--white);border-radius:var(--r);padding:var(--pad);margin-bottom:12px;border:1px solid var(--border)}
.t-section h3{font-family:'Playfair Display',serif;font-size:16px;margin-bottom:10px;color:var(--accent)}
.t-section h4{font-size:14px;font-weight:600;color:var(--ink);margin-top:14px;margin-bottom:8px}
.t-section p,.t-section li{font-size:13px;line-height:1.8}
.t-section ul{padding-left:15px}
.t-section li{margin-bottom:3px}
.tip-box{background:#FFF3E0;border-left:3px solid var(--accent);padding:10px 12px;margin:10px 0;border-radius:3px;font-size:13px;line-height:1.6}
.theory-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.theory-table th{background:var(--warm);padding:8px 10px;text-align:left;font-weight:600;color:var(--ink)}
.theory-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.tbl th{background:var(--warm);padding:7px 10px;text-align:left;font-weight:600}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--warm)}
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
.day-col{background:var(--white);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.day-head{background:var(--ink);color:var(--cream);padding:7px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.5px}
.day-slot{padding:8px;min-height:66px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.day-slot:last-child{border:none}
.day-slot:hover{background:var(--warm)}
.slot-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:3px}
.slot-val{font-size:10px;line-height:1.4;color:var(--ink)}
.slot-empty{font-size:16px;opacity:.25}
.day-slot.takeout{background:#FFF3E0}
.day-slot.takeout .slot-val{color:var(--accent)}
.plan-actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:30px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;transition:all .15s}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:#B36930}
.btn-d{background:var(--ink);color:#fff}.btn-d:hover{background:#0d0804}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--ink)}.btn-o:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:4px 11px;font-size:11px}
.groc-sum{background:var(--white);border-radius:var(--r);padding:var(--pad);border:1px solid var(--border)}
.groc-sum h3{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:5px}
.groc-cat-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 7px}
.groc-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--warm);font-size:13px}
.groc-item:last-child{border:none}
.gl-check{width:16px;height:16px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gl-check.on{background:var(--green);border-color:var(--green)}
.gl-check.on::after{content:'✓';color:#fff;font-size:10px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none!important;align-items:center;justify-content:center;z-index:200;padding:16px}
.overlay.active{display:flex!important}
.modal{background:var(--white);border-radius:20px;padding:24px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:14px}
.m-item{padding:8px 11px;border-radius:var(--rs);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .15s;margin-bottom:2px}
.m-item:hover{background:var(--warm)}
.m-cat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:9px 11px 3px}
.m-footer{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ei{font-size:38px;margin-bottom:11px}
.empty h3{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink);margin-bottom:5px}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:10px;font-size:12px;z-index:300}
.portions-row{display:flex;align-items:center;gap:8px;background:var(--warm);border-radius:30px;padding:4px 12px;font-size:13px}
.cat-card{border-radius:var(--r);padding:18px;cursor:pointer;transition:transform .2s;border:1px solid transparent}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(28,18,8,.08)}
.cat-card .ce{font-size:30px;margin-bottom:7px}
.cat-card h3{font-family:'Playfair Display',serif;font-size:14px;margin-bottom:2px}
.cat-card p{font-size:11px;color:var(--muted)}
@media(max-width:900px){.sidebar{width:200px;min-width:200px}.main{margin-left:200px}.plan-grid{grid-template-columns:repeat(4,1fr)}.detail-grid{grid-template-columns:1fr}}
.sidebar{position:fixed;left:0;top:0}


        /* MOBILE RESPONSIVENESS */
        @media(max-width:768px){
            :root{--sidebar:0px}
            .sidebar{width:280px;transform:translateX(-100%);transition:transform .3s ease;z-index:1000}
            .sidebar.open{transform:translateX(0)}
            .main{margin-left:0}
            .hamburger{display:flex!important}
            .header{padding:12px 16px;gap:8px}
            .header-left h2{font-size:18px}
            .header-left p{font-size:11px}
            .search{min-width:120px}
            .search input{font-size:12px;padding:4px}
            .portions-row{font-size:12px;padding:2px 8px}
            .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
            .grid2{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
            .content{padding:16px}
            .detail-grid{grid-template-columns:1fr}
            .plan-grid{grid-template-columns:repeat(4,1fr);gap:6px}
        }
        
        @media(max-width:480px){
            .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
            .grid2{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
            .header{padding:10px 12px}
            .header-left h2{font-size:16px}
            .search{min-width:100px}
            .card-body{padding:10px}
            .card-body h3{font-size:13px}
            .card-body p{font-size:10px}
            .plan-grid{grid-template-columns:repeat(3,1fr);gap:4px}
            .day-head{font-size:9px;padding:4px}
            .day-slot{padding:6px;min-height:50px;font-size:9px}
            .detail-hero{padding:16px;gap:12px}
            .detail-hero .emoji{font-size:40px}
            .detail-hero h1{font-size:18px}
            .modal{max-width:90vw;padding:16px}
            .modal h3{font-size:15px}
        }
        
        .hamburger{
            display:none;
            background:none;
            border:none;
            color:var(--ink);
            font-size:24px;
            cursor:pointer;
            width:40px;
            height:40px;
            align-items:center;
            justify-content:center;
            padding:0;
        }
        
        .hamburger:hover{opacity:.7}
        
        .overlay{
            display:none!important;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.5);
            z-index:999;
        }
        
        .overlay.active{
            display:flex!important;
            align-items:center;
            justify-content:center;
        }


        /* SMOOTH SCROLLING FOR MOBILE */
        .sidebar {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .content {
            -webkit-overflow-scrolling: touch;
        }
        
        @supports (scrollbar-width: thin) {
            .sidebar {
                scrollbar-width: thin;
                scrollbar-color: rgba(196, 119, 59, 0.3) rgba(255, 255, 255, 0.05);
            }
        }
        
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(196, 119, 59, 0.3);
            border-radius: 3px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(196, 119, 59, 0.5);
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
        @keyframes scaleUp{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
        @keyframes heartPop{0%,100%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.88)}}
        @keyframes toastSlide{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

        .content{animation:fadeIn .24s ease both}
        .detail-hero{animation:slideInRight .28s ease both}
        .modal{animation:scaleUp .18s ease both}
        .toast{animation:toastSlide .22s ease}
        .g-check.on::after,.gl-check.on::after{animation:checkPop .22s ease}

        /* Micro-interactions */
        .btn{transition:all .15s;transform:scale(1)}
        .btn:active{transform:scale(.95)!important}
        .fav-btn:active{animation:heartPop .3s ease}
        .card{transition:transform .2s,box-shadow .2s}
        .theory-card{transition:transform .2s,box-shadow .2s}
        .nav-item{transition:background .12s,color .12s,border-color .12s}
        .cat-card{transition:transform .2s,box-shadow .2s}

        /* ── BOTTOM NAV (mobile only) ── */
        .bottom-nav{
            display:none;
            position:fixed;bottom:0;left:0;right:0;
            background:var(--ink);
            border-top:1px solid rgba(255,255,255,.1);
            z-index:150;
            padding-bottom:env(safe-area-inset-bottom,0px);
        }
        .bottom-nav-inner{display:flex;height:54px}
        .bn-item{
            flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;cursor:pointer;color:rgba(255,255,255,.38);font-size:9px;letter-spacing:.2px;
            transition:color .15s;-webkit-tap-highlight-color:transparent;
            user-select:none;padding:4px 2px;
        }
        .bn-item.active{color:var(--accent)}
        .bn-item .bni{font-size:19px;line-height:1.2}

        /* ── MOBILE LAYOUT IMPROVEMENTS ── */
        @media(max-width:768px){
            .bottom-nav{display:block}
            .main{padding-bottom:62px}
            /* planner: full-width day cards stacked vertically */
            .plan-grid{
                display:flex!important;flex-direction:column;
                gap:10px;overflow-x:unset;padding-bottom:0;
                grid-template-columns:unset!important;
            }
            .day-col{min-width:unset;flex-shrink:unset;border-radius:var(--r)}
            .day-head{border-radius:var(--r) var(--r) 0 0;text-align:left;padding:9px 12px;font-size:10px}
            .day-slot{min-height:52px;padding:8px 12px}
            .slot-val{font-size:12px}
            /* tighter detail layout */
            .detail-hero{flex-direction:column;gap:10px}
            .detail-hero .emoji{font-size:46px}
            .groc-sum{margin-top:12px}
        }
        @media(max-width:480px){
            .header-left h2{font-size:15px}
        }

        /* slot action buttons (edit / remove inside a filled plan slot) */
        .slot-filled{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
        .slot-name{flex:1;cursor:pointer;line-height:1.4}
        .slot-name:hover{color:var(--accent)}
        .slot-acts{display:flex;gap:2px;flex-shrink:0;margin-top:1px}
        .slot-act{background:none;border:none;cursor:pointer;font-size:11px;padding:2px 4px;
                  border-radius:4px;color:var(--muted);transition:background .12s,color .12s;line-height:1}
        .slot-act:hover{background:var(--warm);color:var(--ink)}
        .slot-act.remove:hover{background:#fee2e2;color:#dc2626}


        /* ── KEYBOARD SHORTCUT BADGE ── */
        .kbd-hint{
            font-size:10px;color:var(--muted);margin-top:10px;
            display:flex;gap:10px;flex-wrap:wrap;align-items:center;
        }
        .kbd{
            display:inline-block;background:var(--warm);border:1px solid var(--border);
            border-radius:4px;padding:1px 5px;font-size:10px;font-family:monospace;color:var(--muted);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // ═══════════════════════════════════════════════════════════
        // DATA DEFINITIONS
        // ═══════════════════════════════════════════════════════════

["ginger-bug","snacks","Имбирный жук (закваска)","🫙","3–7 дней",1,0,"Натуральная живая закваска из имбиря и сахара — основа для домашних газированных лимонадов",

["Натрите или мелко нарежьте имбирь вместе с кожурой. Смешайте воду, имбирь и сахар в стеклянной банке.","Накройте марлей или крышкой, поставленной неплотно, чтобы газ мог выходить. Оставьте при 20–26°C на 2–3 дня.","Закваска готова, когда появятся мелкие пузырьки, при перемешивании слышно лёгкое шипение, запах — свежий, слегка дрожжевой.","Если на 3й день ничего нет — добавляйте ежедневно по 1 ст.л. тёртого имбиря и 1 ст.л. сахара, ждите до 7 дней.","Для использования: отлейте через сито около 100г. В оставшийся жук добавьте такое же количество воды, 1 ст.л. сахара и 1 ст.л. имбиря.","Хранение при комнатной температуре — кормите ежедневно; в холодильнике — кормите раз в неделю. Раз в неделю меняйте банку на чистую."],

["Морковь очистите, нарежьте на четвертинки. Обжарьте 15 мин на среднем огне или запеките при 190°C около 20 минут.","Для сальсы измельчите зелень, каперсы и соедините с остальными ингредиентами.","Если кальмары замороженные — разморозьте и очистите. Нарежьте на кольца не толще 1,5 см, посолите, поперчите.","Когда морковь готова, снимите с огня, увеличьте нагрев и обжарьте кальмаров 2–3 минуты.","Соедините кальмаров с морковью, добавьте кусочки авокадо, выложите на блюдо, полейте сальсой и добавьте орешки."],

["Ревень очистите, нарежьте на кусочки, засыпьте 20г сахара. Молоко нагрейте до пара, добавьте чай, накройте крышкой на 10 минут. Процедите через сито.","Желтки разотрите с сахаром и крахмалом венчиком, соедините с молоком. Варите помешивая до загустения. Перелейте в другую ёмкость, быстро охладите, уберите в холодильник на 2–24 ч.","Снимите овощечисткой ⅓ цедры грейпфрута, нарежьте на тонкие полоски. Срежьте белую часть, выньте мякоть. Добавьте к ревню с остальным сахаром, готовьте до мягкости ревня.","Взбейте яйца с молоком и сахаром. Отрежьте толстый слой бриоши, окуните в молоко с яйцом и обжарьте до корочки на кусочке сливочного масла.","Выложите сверху крем, затем джем из ревня и грейпфрута."],

["Для теста соедините все ингредиенты, замесите до гладкости, накройте и оставьте на столе на 40 минут. После можно убрать в холодильник и готовить на следующий день.","Для начинки измельчите лук, чеснок, зелень, болгарский перец и чоризо блендером. Добавьте к фаршу с остальными ингредиентами.","Разогрейте духовку вместе с противнем до 250°C. Тесто разделите на 4 части, присыпьте стол мукой, раскатайте тонко в форме овала. Присыпьте дно хорошо мукой, чтобы не прилипла.","Распределите начинку из фарша по лепёшке, отступая от краёв на 2 см. Выпекайте 8–9 минут.","Для салата нарежьте лук, добавьте сок лимона или уксус, сахар и соль, пожамкайте. Добавьте томаты, зелень, сумах, масло и чёрный перец. Выложите салат поверх горячего лахмаджуна."],

["Картофель отварите в хорошо подсоленной воде около 15 минут после закипания. За 8 минут до готовности добавьте яйца. После приготовления залейте всё холодной водой.","С лимона снимите цедру, выжмите сок. Добавьте оливковое масло, соль, перец и чили, хорошо перемешайте.","Нарежьте горошек с кожурой, если он молодой. Если замороженный без кожуры — залейте кипятком на 5 минут, откиньте на сито. Лук и мяту нарежьте мелко.","Картофель нарежьте на четвертинки, яйца очистите и поломайте руками, сардины — пополам.","Соедините все ингредиенты — сытный салат готов."],

["Соедините все ингредиенты кроме сливочного масла, замесите однородное тесто, накройте чашкой и оставьте на столе на 20 минут.","Тесто разделите на кусочки примерно по 80–90г. Скатайте шарики, оставьте на 5–10 минут.","Стол смажьте растительным маслом, раскатайте каждую лепёшку тонко. Вылейте около 10г растопленного сливочного масла, распределите руками, сверните в трубочку, а потом в улитку, накройте и оставьте на 10 минут.","Раскатайте толщиной около 4 мм. Выпекайте на сухой сковороде из морозилки по 5–6 минут с каждой стороны на огне чуть ниже среднего."],

"Хранится в морозилке. Перед подачей дайте постоять при комнатной температуре 5–10 минут.", "photos/strawberry-ice-cream.jpg"],

    {heading:"Базовый рецепт",list:["1 кг ягод (протёртых при необходимости)","500 г сахара","2 ст.л. любого пектина","⅓ ч.л. лимонной кислоты или 2 ст.л. сока лимона","Выход: 8–10 баночек по 200г"]},
    {heading:"Технология",list:["Простерилизуйте банки (кипячение 15 мин или духовка 120°C — 15 мин)","Пектин смешайте с небольшим количеством сахара","Нагрейте ягоды с остальным сахаром до кипения, прокипятите несколько минут","Всыпьте пектин с сахаром, варите ещё 5 мин","Добавьте лимонную кислоту за 1–2 мин до конца варки","Разлейте горячий джем по банкам, закрутите, переверните крышками вниз на сутки","Хранится в кладовке до года"]},
    {heading:"Классные сочетания",list:["Клубника + базилик + лайм","Малина + мята или чёрный перец","Вишня + корица или гвоздика","Черника / ежевика + лаванда","Абрикос / персик + миндаль или розмарин"]},
   ]},
];
        
        // ═══════════════════════════════════════════════════════════
        // INITIALIZE DATA
        // ═══════════════════════════════════════════════════════════
        
        const RECIPES = RD.map(([id, cat, title, emoji, time, portions, freezable, desc, ingredients, steps, freezeTip, photo]) => ({
            id, cat, title, emoji, time, portions, freezable: Boolean(freezable), desc, freezeTip, photo: photo || null,
            ingredients: ingredients.map(([name, amount]) => ({name, amount})),
            steps
        }));
        
        // ═══════════════════════════════════════════════════════════
        // UTILITY FUNCTIONS
        // ═══════════════════════════════════════════════════════════
        
        function weeklyGroceries(plan) {
            const groceries = {};
            Object.values(plan).forEach(mealId => {
                if (!mealId) return;
                const recipe = RECIPES.find(r => r.id === mealId);
                if (recipe) {
                    recipe.ingredients.forEach(ing => {
                        if (!groceries[ing.name]) groceries[ing.name] = [];
                        groceries[ing.name].push(ing.amount);
                    });
                }
            });
            return groceries;
        }
        
        // ═══════════════════════════════════════════════════════════
        // STATE & STORAGE
        // ═══════════════════════════════════════════════════════════
        
        const state = {
            page: 'home',
            search: '',
            selected: null,
            theorySelected: null,
            planModal: null,
            favorites: JSON.parse(localStorage.getItem('favorites') || '[]'),
            checked: JSON.parse(localStorage.getItem('checked') || '{}'),
            plan: JSON.parse(localStorage.getItem('plan') || '{}')
        };
        
        function saveState() {
            localStorage.setItem('favorites', JSON.stringify(state.favorites));
            localStorage.setItem('checked', JSON.stringify(state.checked));
            localStorage.setItem('plan', JSON.stringify(state.plan));
        }
        
        function navigate(page) {
            state.page = page;
            state.selected = null;
            state.theorySelected = null;
            state.search = '';
            closeSidebar();
            render();
        }
        
        function setSelected(recipe) {
            state.selected = recipe;
            closeSidebar();
            render();
        }
        
        function setTheorySelected(theory) {
            state.theorySelected = theory;
            render();
        }

        function renderTheoryContent(contentArray, tableArray) {
            let html = '';

            if (contentArray && Array.isArray(contentArray)) {
                for (const item of contentArray) {
                    if (item.heading) {
                        html += `<h4>${item.heading}</h4>`;
                        if (item.list && Array.isArray(item.list)) {
                            html += '<ul>';
                            for (const listItem of item.list) {
                                html += `<li>${listItem}</li>`;
                            }
                            html += '</ul>';
                        }
                        if (item.text) {
                            html += `<p>${item.text}</p>`;
                        }
                        if (item.tip) {
                            html += `<div class="tip-box">💡 ${item.tip}</div>`;
                        }
                    }
                }
            }

            if (tableArray && Array.isArray(tableArray) && tableArray.length > 0) {
                html += '<table class="theory-table">';
                const headers = Object.keys(tableArray[0]);
                html += '<thead><tr>';
                for (const header of headers) {
                    html += `<th>${header}</th>`;
                }
                html += '</tr></thead><tbody>';
                for (const row of tableArray) {
                    html += '<tr>';
                    for (const header of headers) {
                        html += `<td>${row[header]}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</tbody></table>';
            }

            return html;
        }

        function toggleFavorite(recipeId) {
            const idx = state.favorites.indexOf(recipeId);
            if (idx > -1) state.favorites.splice(idx, 1);
            else state.favorites.push(recipeId);
            saveState();
            render();
        }
        
        let searchTimeout;
        function updateSearch(query) {
            state.search = query;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const inp = document.getElementById('searchInput');
                const pos = inp ? inp.selectionStart : null;
                render();
                const newInp = document.getElementById('searchInput');
                if (newInp) {
                    newInp.focus();
                    if (pos !== null) newInp.setSelectionRange(pos, pos);
                }
            }, 80);
        }
        
        function toggleCheck(key) {
            state.checked[key] = !state.checked[key];
            saveState();
            render();
        }
        
        function goBack() {
            state.selected = null;
            state.theorySelected = null;
            render();
        }
        
        // ═══════════════════════════════════════════════════════════
        // RENDER FUNCTION
        // ═══════════════════════════════════════════════════════════
        
        function render() {
            const root = document.getElementById('root');
            
            let html = '<div class="app"><div class="overlay" id="overlay" onclick="toggleSidebar()"></div><aside class="sidebar" id="sidebar"><div class="logo"><h1>Моя <span>Кухня</span></h1><p>Книга рецептов</p></div>';
            
            // Navigation items
            const NAV = [
                {id:"home",icon:"🏠",label:"Главная"},
                {section:"Рецепты"},
                {id:"poultry",icon:"🐔",label:"Птица"},
                {id:"beef",icon:"🥩",label:"Говядина & Свинина"},
                {id:"fish",icon:"🐟",label:"Рыба"},
                {id:"soups",icon:"🍲",label:"Супы & Бульоны"},
                {id:"vegetarian",icon:"🥦",label:"Вегетарианское"},
                {id:"salads",icon:"🥗",label:"Салаты & Гарниры"},
                {id:"snacks",icon:"🫙",label:"Закуски & Соусы"},
                {id:"breakfast",icon:"🌅",label:"Завтраки"},
                {id:"desserts",icon:"🍰",label:"Десерты"},
                {id:"baking",icon:"🥐",label:"Выпечка"},
                {section:"Знания"},
                {id:"theory",icon:"📖",label:"Теория кухни"},
                {section:"Планирование"},
                {id:"planner",icon:"📅",label:"Недельный план"},
                {section:""},
                {id:"favorites",icon:"❤️",label:"Избранное"},
            ];
            
            NAV.forEach(item => {
                if (item.section !== undefined) {
                    html += item.section 
                        ? `<div class="sec-title">${item.section}</div>`
                        : '<div style="height:6px"></div>';
                } else {
                    const active = state.page === item.id && !state.selected && !state.theorySelected ? ' active' : '';
                    const badge = item.id === 'favorites' && state.favorites.length > 0 
                        ? `<span class="badge" style="margin-left:auto">${state.favorites.length}</span>`
                        : '';
                    html += `<div class="nav-item${active}" onclick="navigate('${item.id}')">
                        <span class="ni">${item.icon}</span>${item.label}${badge}
                    </div>`;
                }
            });
            
            // Determine header
            let title = 'Моя Кухня';
            let subtitle = 'Рецепты, теория и планировщик';
            
            if (state.selected) {
                title = state.selected.title;
                subtitle = CAT[state.selected.cat]?.label || '';
            } else if (state.theorySelected) {
                title = state.theorySelected.title;
                subtitle = state.theorySelected.subtitle || '';
            } else if (state.page === 'theory') {
                title = 'Теория кухни';
                subtitle = `${THEORY.length} разделов`;
            } else if (state.page === 'planner') {
                title = 'Недельный план';
                subtitle = 'Обед + ужин · 7 дней · список покупок';
            } else if (state.page === 'favorites') {
                title = 'Избранное';
                subtitle = `${state.favorites.length} рецептов`;
            } else if (CAT[state.page]) {
                title = CAT[state.page].label;
                subtitle = `${RECIPES.filter(r => r.cat === state.page).length} рецептов`;
            }
            
            html += '</aside><main class="main"><div class="header"><button class="hamburger" id="menuBtn" onclick="toggleSidebar()">☰</button><div class="header-left"><h2>' + title + '</h2><p>' + subtitle + '</p></div>';
            
            // Search and portions controls
            if (!state.selected && !state.theorySelected && state.page !== 'planner') {
                html += `<div class="search"><span>🔍</span><input type="text" placeholder="Поиск... (нажмите /)" value="${state.search}" oninput="updateSearch(this.value)" id="searchInput"/></div>`;
            }
            
            html += '</div><div class="content">';
            
            // HOME
            if (state.page === 'home' && !state.selected) {
              if (!state.search) {
                html += '<div class="grid2" style="margin-bottom:20px">';
                Object.entries(CAT).forEach(([catId, cat]) => {
                    const count = RECIPES.filter(r => r.cat === catId).length;
                    html += `<div class="cat-card" style="background:${cat.bg};border-color:${cat.accent}33" onclick="navigate('${catId}')">
                        <div class="ce">${cat.emoji}</div><h3 style="color:${cat.accent}">${cat.label}</h3><p>${count} рецептов</p></div>`;
                });
                html += '</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';
                html += `<div style="background:var(--ink);color:var(--cream);border-radius:var(--r);padding:20px;cursor:pointer" onclick="navigate('theory')">
                    <div style="font-size:28px;margin-bottom:7px">📖</div>
                    <div style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:3px">Теория кухни</div>
                    <div style="font-size:11px;opacity:.6">${THEORY.length} разделов</div>
                </div>
                <div style="background:var(--accent);color:#fff;border-radius:var(--r);padding:20px;cursor:pointer" onclick="navigate('planner')">
                    <div style="font-size:28px;margin-bottom:7px">📅</div>
                    <div style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:3px">Недельный план</div>
                    <div style="font-size:11px;opacity:.8">Обед + ужин + список покупок</div>
                </div></div>`;
              } else {
                // Global search results across all recipes
                const q = state.search.toLowerCase();
                const globalResults = RECIPES.filter(r =>
                    r.title.toLowerCase().includes(q) ||
                    r.desc.toLowerCase().includes(q)
                );
                if (globalResults.length) {
                    html += `<p style="font-size:12px;color:var(--muted);margin-bottom:14px">Найдено: ${globalResults.length} рецептов</p><div class="grid">`;
                    globalResults.forEach((recipe, ci) => {
                        const isFav = state.favorites.includes(recipe.id);
                        const delay = Math.min(ci * 38, 200);
                        html += `<div class="card" style="animation:fadeIn .22s ${delay}ms ease both" onclick="setSelected(RECIPES.find(r => r.id==='${recipe.id}'))">
                            <div class="card-hero" style="position:relative">
                                <span style="font-size:42px">${recipe.emoji}</span>
                                <button class="fav-btn" onclick="event.stopPropagation(); toggleFavorite('${recipe.id}')">${isFav ? '❤️' : '🤍'}</button>
                            </div>
                            <div class="card-body">
                                <h3>${recipe.title}</h3>
                                <p>${recipe.desc}</p>
                                <div class="tags">
                                    <span class="tag t-time">⏱ ${recipe.time}</span>
                                    <span class="tag t-port">👥 ${recipe.portions}</span>
                                    ${recipe.freezable ? '<span class="tag t-freeze">❄️ Заморозка</span>' : ''}
                                </div>
                            </div>
                        </div>`;
                    });
                    html += '</div>';
                } else {
                    html += `<div class="empty"><div class="ei">🔍</div><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос</p></div>`;
                }
              }
            }

            // RECIPE LIST
            const isCat = CAT[state.page];
            const filteredRecipes = isCat
                ? RECIPES.filter(r => r.cat === state.page && (!state.search || r.title.toLowerCase().includes(state.search.toLowerCase())))
                : state.page === 'favorites'
                ? RECIPES.filter(r => state.favorites.includes(r.id) && (!state.search || r.title.toLowerCase().includes(state.search.toLowerCase())))
                : [];
            
            if ((isCat || state.page === 'favorites') && !state.selected) {
                if (filteredRecipes.length) {
                    html += '<div class="grid">';
                    filteredRecipes.forEach((recipe, ci) => {
                        const isFav = state.favorites.includes(recipe.id);
                        const delay = Math.min(ci * 38, 200);
                        html += `<div class="card" style="animation:fadeIn .22s ${delay}ms ease both" onclick="setSelected(RECIPES.find(r => r.id==='${recipe.id}'))">
                            <div class="card-hero" style="position:relative">
                                <span style="font-size:42px">${recipe.emoji}</span>
                                <button class="fav-btn" onclick="event.stopPropagation(); toggleFavorite('${recipe.id}')">${isFav ? '❤️' : '🤍'}</button>
                            </div>
                            <div class="card-body">
                                <h3>${recipe.title}</h3>
                                <p>${recipe.desc}</p>
                                <div class="tags">
                                    <span class="tag t-time">⏱ ${recipe.time}</span>
                                    <span class="tag t-port">👥 ${recipe.portions}</span>
                                    ${recipe.freezable ? '<span class="tag t-freeze">❄️ Заморозка</span>' : ''}
                                </div>
                            </div>
                        </div>`;
                    });
                    html += '</div>';
                } else {
                    html += `<div class="empty"><div class="ei">${state.page === 'favorites' ? '❤️' : '🔍'}</div>
                        <h3>${state.page === 'favorites' ? 'Нет избранных' : 'Рецепты не найдены'}</h3>
                        <p>${state.page === 'favorites' ? 'Нажмите 🤍' : 'Попробуйте изменить запрос'}</p></div>`;
                }
            }
            
            // RECIPE DETAIL
            if (state.selected) {
                const sel = state.selected;
                const isFav = state.favorites.includes(sel.id);
                html += `<div style="max-width:760px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px">
                    <div class="back" style="margin-bottom:0" onclick="goBack()">← Назад</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <button onclick="toggleFavorite('${sel.id}')" style="display:flex;align-items:center;gap:6px;background:${isFav ? '#fee2e2' : 'var(--warm)'};border:none;border-radius:30px;padding:6px 14px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;transition:all .15s">
                            ${isFav ? '❤️ В избранном' : '🤍 В избранное'}
                        </button>
                        <div class="kbd-hint" style="margin-top:0;display:none" id="kbdHints">
                            <span><kbd class="kbd">Esc</kbd> назад</span>
                            <span><kbd class="kbd">+</kbd> <kbd class="kbd">−</kbd> порции</span>
                        </div>
                    </div>
                </div>
                    <div class="detail-hero">
                        <div class="emoji">${sel.emoji}</div>
                        <div>
                            <h1>${sel.title}</h1><p>${sel.desc}</p>
                            <div class="meta-row">
                                <span class="meta-chip">⏱ ${sel.time}</span>
                                <span class="meta-chip">👥 ${sel.portions} порций</span>
                                ${sel.freezable ? '<span class="meta-chip">❄️ Можно заморозить</span>' : ''}
                            </div>
                        </div>
                    </div>
                    ${sel.photo ? `<div class="recipe-photo-wrap"><img class="recipe-photo" src="${sel.photo}" alt="${sel.title}" loading="lazy"></div>` : ''}
                    <div class="detail-grid">
                        <div class="box"><h4>🛒 Ингредиенты</h4>`;
                sel.ingredients.forEach((ing, i) => {
                    html += `<div class="ing-row"><span>${ing.name}</span><span class="amt">${ing.amount}</span></div>`;
                });
                html += `</div><div class="box" style="background:var(--warm)"><h4>💡 Заметки</h4>`;
                if (sel.freezable) html += `<div class="freeze-box">❄️ ${sel.freezeTip}</div>`;
                html += `<div style="font-size:12px;color:var(--muted);line-height:1.7">
                    <div>⏱ ${sel.time}</div>
                    <div style="margin-top:3px">👥 ${sel.portions} порций</div>
                    ${sel.freezable ? '<div style="margin-top:3px">🗃️ В морозилке до 6 мес</div>' : ''}
                </div></div>
                <div class="box full"><h4>👨‍🍳 Приготовление</h4>`;
                sel.steps.forEach((step, i) => {
                    html += `<div class="step"><div class="step-n">${i + 1}</div><p>${step}</p></div>`;
                });
                html += `</div></div><div class="grocery-panel"><h4>🛒 Список покупок</h4>`;
                sel.ingredients.forEach((ing, i) => {
                    const key = `${sel.id}-${i}`;
                    const isChecked = state.checked[key];
                    html += `<div class="g-row">
                        <div class="g-check${isChecked ? ' on' : ''}" onclick="toggleCheck('${key}')"></div>
                        <span style="text-decoration:${isChecked ? 'line-through' : 'none'};opacity:${isChecked ? '.5' : '1'}">${ing.name} — ${ing.amount}</span>
                    </div>`;
                });
                html += `</div></div>`;
            }

            // THEORY
            if (state.page === 'theory' && !state.theorySelected) {
                html += '<div class="grid2">';
                THEORY.forEach(t => {
                    html += `<div class="theory-card" onclick="setTheorySelected(THEORY.find(th => th.id==='${t.id}'))">
                        <div class="ti">${t.icon}</div><h3>${t.title}</h3><p>${t.subtitle}</p></div>`;
                });
                html += '</div>';
            }

            if (state.theorySelected) {
                const t = state.theorySelected;
                html += `<div class="back" onclick="goBack()">← Назад</div>
                    <div class="t-section"><h3>${t.title}</h3>${renderTheoryContent(t.content, t.table)}</div>`;
            }

            // PLANNER
            if (state.page === 'planner') {
                const DAYS = [
                    {key:'mon',label:'Понедельник'},{key:'tue',label:'Вторник'},{key:'wed',label:'Среда'},
                    {key:'thu',label:'Четверг'},{key:'fri',label:'Пятница'},
                    {key:'sat',label:'Суббота'},{key:'sun',label:'Воскресенье'}
                ];
                html += `<div class="plan-actions">
                    <button class="btn btn-p btn-sm" onclick="generatePlan()">✨ Сгенерировать план</button>
                    <button class="btn btn-o btn-sm" onclick="clearPlan()">🗑 Очистить</button>
                </div><div class="plan-grid">`;

                DAYS.forEach(day => {
                    const lunchId  = state.plan[day.key + '-lunch'];
                    const dinnerId = state.plan[day.key + '-dinner'];
                    const lunchR  = lunchId  ? RECIPES.find(r => r.id === lunchId)  : null;
                    const dinnerR = dinnerId ? RECIPES.find(r => r.id === dinnerId) : null;

                    const slotHtml = (mealKey, r) => r
                        ? `<div class="slot-filled">
                               <span class="slot-name" onclick="viewPlanRecipe('${r.id}')">${r.emoji} ${r.title}</span>
                               <span class="slot-acts">
                                   <button class="slot-act" title="Изменить" onclick="openPlanModal('${day.key}','${mealKey}')">✏️</button>
                                   <button class="slot-act remove" title="Убрать" onclick="setPlanMeal('${day.key}','${mealKey}',null)">✕</button>
                               </span>
                           </div>`
                        : `<span class="slot-empty" onclick="openPlanModal('${day.key}','${mealKey}')" style="cursor:pointer">+</span>`;

                    html += `<div class="day-col">
                        <div class="day-head">${day.label}</div>
                        <div class="day-slot${lunchR ? '' : ''}" onclick="${lunchR ? '' : `openPlanModal('${day.key}','lunch')`}" style="${lunchR ? '' : 'cursor:pointer'}">
                            <div class="slot-lbl">Обед</div>
                            <div class="slot-val">${slotHtml('lunch', lunchR)}</div>
                        </div>
                        <div class="day-slot" onclick="${dinnerR ? '' : `openPlanModal('${day.key}','dinner')`}" style="${dinnerR ? '' : 'cursor:pointer'}">
                            <div class="slot-lbl">Ужин</div>
                            <div class="slot-val">${slotHtml('dinner', dinnerR)}</div>
                        </div>
                    </div>`;
                });

                html += '</div>';

                const groceries = weeklyGroceries(state.plan);
                if (Object.keys(groceries).length > 0) {
                    html += `<div class="groc-sum" style="margin-top:18px"><h3>🛒 Список покупок на неделю</h3>
                        <p style="font-size:11px;color:var(--muted);margin-bottom:10px">На основе выбранных рецептов</p>`;
                    Object.entries(groceries).forEach(([name, amounts]) => {
                        const gkey = 'groc-' + name;
                        const isChecked = state.checked[gkey];
                        html += `<div class="groc-item">
                            <div class="gl-check${isChecked ? ' on' : ''}" onclick="toggleCheck('${gkey}')"></div>
                            <span style="text-decoration:${isChecked ? 'line-through' : 'none'};opacity:${isChecked ? '.5' : '1'}">${name}</span>
                        </div>`;
                    });
                    html += '</div>';
                } else {
                    html += `<div class="empty"><div class="ei">📅</div><h3>План пуст</h3>
                        <p>Нажмите <strong>✨ Сгенерировать план</strong> или добавьте блюда вручную</p></div>`;
                }
            }

            html += '</div></main></div>';

            // Plan modal
            if (state.planModal) {
                const {day, meal} = state.planModal;
                const mealLabel = meal === 'lunch' ? 'Обед' : 'Ужин';
                const dayNames = {mon:'Понедельник',tue:'Вторник',wed:'Среда',thu:'Четверг',fri:'Пятница',sat:'Суббота',sun:'Воскресенье'};
                html += `<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px" onclick="closePlanModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <h3>📅 ${dayNames[day]}, ${mealLabel}</h3>`;
                Object.entries(CAT).forEach(([catId, cat]) => {
                    const catRecipes = RECIPES.filter(r => r.cat === catId);
                    if (!catRecipes.length) return;
                    html += `<div class="m-cat-lbl">${cat.emoji} ${cat.label}</div>`;
                    catRecipes.forEach(recipe => {
                        html += `<div class="m-item" onclick="setPlanMeal('${day}','${meal}','${recipe.id}')">${recipe.emoji} ${recipe.title}</div>`;
                    });
                });
                html += `<div class="m-footer">
                        <button class="btn btn-o btn-sm" onclick="setPlanMeal('${day}','${meal}',null)">Очистить ячейку</button>
                        <button class="btn btn-d btn-sm" onclick="closePlanModal()">Закрыть</button>
                    </div></div></div>`;
            }

            // Bottom navigation (mobile)
            const bnPages = ['poultry','beef','fish','soups','vegetarian','salads','snacks','breakfast','desserts','baking'];
            const BN = [
                {id:'home',   icon:'🏠', label:'Главная'},
                {id:'poultry',icon:'🍽', label:'Рецепты'},
                {id:'theory', icon:'📖', label:'Теория'},
                {id:'planner',icon:'📅', label:'Планировщик'},
                {id:'favorites',icon:'❤️',label:'Избранное'},
            ];
            html += '<nav class="bottom-nav"><div class="bottom-nav-inner">';
            BN.forEach(item => {
                const isActive = item.id === 'poultry'
                    ? (bnPages.includes(state.page) || !!state.selected)
                    : item.id === 'theory'
                    ? (state.page === 'theory' || !!state.theorySelected)
                    : (state.page === item.id && !state.selected && !state.theorySelected);
                html += `<div class="bn-item${isActive ? ' active' : ''}" onclick="navigate('${item.id}')">
                    <span class="bni">${item.icon}</span><span>${item.label}</span>
                </div>`;
            });
            html += '</div></nav>';

            root.innerHTML = html;
        }


        // ═══════════════════════════════════════════════════════════
        // PLANNER FUNCTIONS
        // ═══════════════════════════════════════════════════════════

        function openPlanModal(day, meal) {
            state.planModal = {day, meal};
            render();
        }

        function closePlanModal() {
            state.planModal = null;
            render();
        }

        function setPlanMeal(day, meal, recipeId) {
            if (recipeId) {
                state.plan[day + '-' + meal] = recipeId;
            } else {
                delete state.plan[day + '-' + meal];
            }
            state.planModal = null;
            saveState();
            render();
        }

        function clearPlan() {
            state.plan = {};
            saveState();
            render();
        }

        function generatePlan() {
            const pool = RECIPES.filter(r =>
                ['poultry','beef','fish','vegetarian','soups','salads'].includes(r.cat)
            );
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
            const MEALS = ['lunch','dinner'];
            let idx = 0;
            const newPlan = {};
            DAYS.forEach(day => {
                MEALS.forEach(meal => {
                    if (idx < shuffled.length) newPlan[day + '-' + meal] = shuffled[idx++].id;
                });
            });
            state.plan = newPlan;
            saveState();
            render();
        }

        function viewPlanRecipe(recipeId) {
            const recipe = RECIPES.find(r => r.id === recipeId);
            if (recipe) setSelected(recipe);
        }


        // ═══════════════════════════════════════════════════════════
        // MOBILE SIDEBAR TOGGLE
        // ═══════════════════════════════════════════════════════════

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        // ═══════════════════════════════════════════════════════════
        // KEYBOARD SHORTCUTS
        // ═══════════════════════════════════════════════════════════

        document.addEventListener('keydown', function(e) {
            // Don't steal input from text fields
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                if (e.key === 'Escape') e.target.blur();
                return;
            }
            switch(true) {
                case e.key === 'Escape':
                    if (state.planModal) closePlanModal();
                    else if (state.selected || state.theorySelected) goBack();
                    else closeSidebar();
                    break;
                // / or Ctrl/Cmd+K → focus search
                case e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey)):
                    e.preventDefault();
                    const inp = document.getElementById('searchInput');
                    if (inp) inp.focus();
                    break;
                // Alt+← or Backspace → go back
                case (e.key === 'Backspace' || e.key === 'ArrowLeft') && e.altKey:
                    if (state.selected || state.theorySelected) { e.preventDefault(); goBack(); }
                    break;
                // f → toggle favourite on open recipe
                case e.key === 'f' && !!state.selected:
                    toggleFavorite(state.selected.id);
                    break;

            }
        });

        // Initial render
        render();
    </script>
</body>
</html>
